<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tahmin Robotu</title><link rel="icon" href="data:,"><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0a6b4f">
<style>
:root{--bg:#f6f7f8;--card:#fff;--ink:#14181d;--mut:#616b76;--line:#e1e5e9;--acc:#0a6b4f;--warn:#8a5a00;--warnbg:#fff5df;--bad:#b3261e}
@media(prefers-color-scheme:dark){:root{--bg:#101316;--card:#191d21;--ink:#eef1f3;--mut:#9aa4ae;--line:#2b3136;--acc:#4cc99f;--warn:#f0c26a;--warnbg:#2c2513;--bad:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}main{max-width:720px;margin:auto;padding:20px 16px 48px}h1{font-size:24px;margin:0}h2{font-size:17px;margin:26px 0 10px}.sub{color:var(--mut);font-size:14px}
.tabs{display:flex;gap:6px;margin:14px 0}.tabs button{flex:1;padding:9px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;font:inherit;cursor:pointer}.tabs button[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:var(--bg);font-weight:600}
.m{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px}.top{color:var(--mut);font-size:13px}.teams{font-weight:600;margin:3px 0 7px}.bet{font-weight:700;color:var(--acc);font-size:17px}.min{font-size:15px;margin-top:1px}.alts{color:var(--mut);font-size:13px;margin-top:6px}.hot{float:right;font-size:12px;background:var(--acc);color:var(--bg);border-radius:5px;padding:1px 6px;font-weight:600}
.warn{background:var(--warnbg);color:var(--warn);border-radius:8px;padding:10px 12px;font-size:14px;margin:12px 0}table{width:100%;border-collapse:collapse;font-size:14px}td{padding:6px 4px;border-bottom:1px solid var(--line)}td:last-child{text-align:right}.pos{color:var(--acc)}.neg{color:var(--bad)}
</style></head><body><main><h1>Tahmin Robotu</h1><div class="sub"><a href="gecmis.html">Geçmiş maç sınavını aç</a></div><div class="sub" id="upd">Yükleniyor…</div>
<div class="tabs" id="days"></div><div class="tabs" id="sports"><button data-s="football" aria-pressed="true">Futbol</button><button data-s="basketball" aria-pressed="false">Basketbol</button></div><h2>Kâr kuralı</h2><div class="sub">En yüksek beklenen kâr. Oran 1,20 veya kartta yazan sınırın altındaysa oynama. Sanal takip için.</div><section id="safe"></section><h2>%80 kuralı</h2><div class="sub">En yüksek tutma ihtimali. Sanal takip için.</div><section id="hit"></section><h2>Bütün maçlar</h2><section id="list"></section>
<h2>Robotun karnesi (sanal)</h2><div id="card" class="sub"></div><table id="recent"></table><div id="warn"></div><h2>Kullanılan veri kaynakları</h2><table id="src"></table></main>
<script>
const $=i=>document.getElementById(i),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])),odd=v=>Number(v).toFixed(2).replace(".",",");let D,day,sport="football";
function dayBtns(){const t=D.days;$("days").innerHTML=[[t.today,"Bugün"],[t.tomorrow,"Yarın"]].map(([k,l])=>`<button data-d="${k}" aria-pressed="${k===day}">${l}</button>`).join("");$("days").querySelectorAll("button").forEach(b=>b.onclick=()=>{day=b.dataset.d;dayBtns();draw()})}
function card(m){return `<article class="m"><div class="top">${esc(new Date(m.kickoff).toLocaleTimeString("tr-TR",{hour:"2-digit",minute:"2-digit"}))} · ${esc(m.league)}</div><div class="teams">${esc(m.home)} – ${esc(m.away)}</div><div class="bet">${esc(m.bet.label)}</div>${m.bet.unverified?'<div class="alts">Geçmiş testi yok, sonuç birikiyor.</div>':""}<div class="min">${m.bet.odds?`Piyasa ortalaması <b>${odd(m.bet.odds)}</b> · en az ${odd(m.bet.minPlay)} ise oyna`:`Oran en az <b>${odd(m.bet.minPlay)}</b> ise oyna${m.bet.estOdds?` · Robotun oran tahmini: ${odd(m.bet.estOdds)}`:""}`}</div>${(m.alts||[]).length?`<div class="alts">Alternatif: ${m.alts.map(a=>`${esc(a.label)} (en az ${odd(a.minPlay)})`).join(" · ")}</div>`:""}</article>`}
function draw(){const l=(D.matches||[]).filter(m=>m.dayKey===day&&m.sport===sport);$("safe").innerHTML=l.filter(m=>m.bet.safe).map(card).join("")||`<div class="m sub">Bu gün için kâr şartını geçen maç yok.</div>`;$("hit").innerHTML=l.filter(m=>m.bet.second).map(m=>card({...m,bet:m.bet.second,alts:[]})).join("")||`<div class="m sub">Bu gün için %80 şartını geçen maç yok.</div>`;$("list").innerHTML=l.map(card).join("")||`<div class="m sub">Bu seçim için maç bulunamadı.</div>`}
Promise.all([fetch("data.json?"+Date.now()).then(r=>r.json()),fetch("decision.json?"+Date.now()).then(r=>r.ok?r.json():null).catch(()=>null)]).then(([d,dc])=>{D=d;day=d.days.today;dayBtns();draw();$("upd").textContent=`Son güncelleme: ${new Date(d.generatedAt).toLocaleString("tr-TR")}`;const tc=d.tipCard||{},ln=(n,c={})=>`${n}: ${c.done||0} seçim sonuçlandı, ${c.won||0} kazandı, ${c.profit>0?"+":""}${c.profit??0} birim, ${c.pending||0} bekliyor.`;$("card").innerHTML=[ln("Kâr kuralı",tc.kar),ln("%80 kuralı",tc.isabet),ln("Basketbol testi",tc.test),ln("Basketbol motoru",tc.basket)].map(x=>`<div>${esc(x)}</div>`).join("");$("recent").innerHTML=(d.tipRecent||[]).map(r=>`<tr><td>${esc(r.home)} – ${esc(r.away)} <b>${esc(r.score)}</b><br><small>${esc(r.label)}</small></td><td class="${r.won?"pos":"neg"}">${r.won?"Kazandı":"Kaybetti"}</td></tr>`).join("");fetch("sources.json?"+Date.now()).then(r=>r.json()).then(x=>{$("src").innerHTML=x.sources.filter(v=>v.usable).map(v=>`<tr><td><a href="${esc(v.url)}" rel="noopener">${esc(v.name)}</a></td><td>${esc(v.group)}</td></tr>`).join("")}).catch(()=>{});$("warn").innerHTML=`<div class="warn"><b>Sanal takip.</b> ${esc(d.verdict||"Kâr henüz kanıtlanmadı.")} Kazanç garantisi yoktur, kaybedebileceğinden fazlasını riske atma.</div>`}).catch(()=>{$("upd").textContent="Veri henüz hazır değil, birazdan yenile."});
$("sports").querySelectorAll("button").forEach(b=>b.onclick=()=>{sport=b.dataset.s;$("sports").querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b));if(D)draw()});
</script></body></html>
