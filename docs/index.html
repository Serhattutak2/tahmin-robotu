<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tahmin Robotu</title><link rel="icon" href="data:,">
<style>
:root{--bg:#f6f7f8;--card:#fff;--ink:#14181d;--mut:#616b76;--line:#e1e5e9;--acc:#0a6b4f;--warn:#8a5a00;--warnbg:#fff5df;--bad:#b3261e}
@media(prefers-color-scheme:dark){:root{--bg:#101316;--card:#191d21;--ink:#eef1f3;--mut:#9aa4ae;--line:#2b3136;--acc:#4cc99f;--warn:#f0c26a;--warnbg:#2c2513;--bad:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:760px;margin:auto;padding:20px 16px 48px}h1{font-size:24px;margin:0}h2{font-size:17px;margin:28px 0 10px}.sub{color:var(--mut);font-size:14px}
.tabs{display:flex;gap:6px;margin:14px 0}.tabs button{flex:1;padding:9px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;font:inherit;cursor:pointer}.tabs button[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:var(--bg);font-weight:600}
.pick{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:13px 14px;margin-bottom:9px}.top{display:flex;justify-content:space-between;gap:10px;color:var(--mut);font-size:13px}.teams{font-weight:600;margin:4px 0 9px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.sel{font-weight:700;color:var(--acc)}.odd{font-size:22px;font-weight:700}.meta{color:var(--mut);font-size:13px;margin-top:7px}
.tag{font-size:12px;border:1px solid var(--line);border-radius:5px;padding:0 5px;white-space:nowrap}.warn{background:var(--warnbg);color:var(--warn);border-radius:8px;padding:10px 12px;font-size:14px;margin:12px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}.st{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px}.st b{display:block;font-size:20px}.st span{color:var(--mut);font-size:13px}.neg{color:var(--bad)}.pos{color:var(--acc)}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:10px;padding:26px;text-align:center;color:var(--mut)}table{width:100%;border-collapse:collapse;font-size:14px}td{padding:6px 4px;border-bottom:1px solid var(--line)}td:last-child{text-align:right}
</style></head><body><main><h1>Tahmin Robotu</h1><div class="sub" id="upd">Yükleniyor…</div>
<div class="tabs"><button data-s="all" aria-pressed="true">Tümü</button><button data-s="football" aria-pressed="false">Futbol</button><button data-s="basketball" aria-pressed="false">Basketbol</button></div>
<div id="warn"></div><section id="picks"></section><h2>Robotun gerçek kaydı</h2><div class="grid" id="real"></div><h2>Geçmiş test</h2><div id="bt" class="sub"></div><h2>Son sonuçlar</h2><table id="recent"></table><h2>Veri kaynakları</h2><table id="src"></table></main>
<script>
const $=i=>document.getElementById(i),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])),pc=(v,d=1)=>v==null?"–":(v*100).toFixed(d).replace(".",",")+"%",sg=v=>v==null?"":v>=0?"pos":"neg";let D,sport="all";
const when=t=>new Date(t).toLocaleString("tr-TR",{weekday:"short",hour:"2-digit",minute:"2-digit"});
function draw(){const l=D.picks.filter(p=>sport==="all"||p.sport===sport);$("picks").innerHTML=l.length?l.map(p=>`<article class="pick"><div class="top"><span>${esc(when(p.kickoff))} · ${esc(p.league)}</span><span class="tag">${p.verified?"Keskin oranla":"Tek kaynak"}</span></div><div class="teams">${esc(p.home)} – ${esc(p.away)}</div><div class="row"><span class="sel">${esc(p.selection)}</span><span class="odd">${p.odds.toFixed(2).replace(".",",")}</span></div><div class="meta">Olasılık ${pc(p.probability)} · Beklenen avantaj ${pc(p.edge)} · En az ${p.minPlayableOdds.toFixed(2).replace(".",",")} oranla oyna · ${esc(p.bookmaker)}</div></article>`).join(""):`<div class="empty">Şu an şartları geçen maç yok. Değerlendirilen ${D.stats.evaluated} maçın ${D.stats.withOdds} tanesinde oran bulundu.</div>`}
Promise.all([fetch("data.json?"+Date.now()).then(r=>r.json()),fetch("backtest.json?"+Date.now()).then(r=>r.ok?r.json():null).catch(()=>null)]).then(([d,b])=>{D=d;$("upd").textContent=`Son güncelleme: ${new Date(d.generatedAt).toLocaleString("tr-TR")} · ${d.stats.evaluated} maç değerlendirildi · ${d.stats.withOdds} tanesinde oran var`;
const t=b?.test;$("warn").innerHTML=!t||t.roi<=0||t.ciLow<=0?`<div class="warn"><b>Test aşaması, gerçek para koyma.</b> ${t?`Geçmiş testte kârlılık kanıtlanmadı (${pc(t.roi)}).`:"Geçmiş test henüz tamamlanmadı."} Listede yalnızca oranı ${String(d.strategy.minOdds).replace(".",",")} ve üstü, hesaba göre avantajlı maçlar var; kazanç garantisi yoktur.</div>`:`<div class="warn">Geçmiş test olumlu, ama kazanç garantisi yoktur. Gerçek kayıt birikmeden büyük risk alma.</div>`;
const L=d.ledger.all;$("real").innerHTML=[["Biten seçim",L.picks],["Bekleyen",L.pending],["İsabet",pc(L.hitRate)],["Kâr/zarar (birim)",`<i class="${sg(L.profit)}" style="font-style:normal">${L.profit>0?"+":""}${L.profit}</i>`],["Getiri",`<i class="${sg(L.roi)}" style="font-style:normal">${pc(L.roi)}</i>`]].map(([k,v])=>`<div class="st"><b>${v}</b><span>${k}</span></div>`).join("");
$("bt").innerHTML=t?`Test sezonları ${b.testSeasons.join(", ")}: ${t.picks} seçim, isabet ${pc(t.hitRate)}, ortalama oran ${t.avgOdds}, <b class="${sg(t.roi)}">getiri ${pc(t.roi)}</b> (%95 aralık ${pc(t.ciLow)} / ${pc(t.ciHigh)}). Basketbol ve tek kaynaklı maçlar bu testin dışındadır.`:"Henüz yok.";
$("recent").innerHTML=d.ledger.recent.map(r=>`<tr><td>${esc(r.home)} – ${esc(r.away)}<br><small>${esc(r.selection)} @ ${r.odds} · ${esc(r.score)}</small></td><td class="${r.profit>0?"pos":"neg"}">${r.profit>0?"+":""}${r.profit.toFixed(2)}</td></tr>`).join("")||"<tr><td>Henüz biten seçim yok.</td></tr>";
$("src").innerHTML=Object.entries(d.sources).map(([k,v])=>`<tr><td>${esc(k)}</td><td class="${v.ok?"pos":"neg"}">${esc(v.info)}</td></tr>`).join("");draw()}).catch(()=>{$("upd").textContent="Veri henüz hazır değil, birazdan yenile."});
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{sport=b.dataset.s;document.querySelectorAll(".tabs button").forEach(x=>x.setAttribute("aria-pressed",x===b));if(D)draw()});
</script></body></html>
