<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Geçmiş Maç Sınavı</title><link rel="icon" href="data:,">
<style>:root{--bg:#f6f7f8;--card:#fff;--ink:#14181d;--mut:#616b76;--line:#e1e5e9;--acc:#0a6b4f;--bad:#b3261e}
@media(prefers-color-scheme:dark){:root{--bg:#101316;--card:#191d21;--ink:#eef1f3;--mut:#9aa4ae;--line:#2b3136;--acc:#4cc99f;--bad:#f28b82}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,sans-serif}main{max-width:760px;margin:auto;padding:20px 16px 48px}h1{font-size:24px;margin:0}h2{font-size:17px;margin:24px 0 8px}.sub{color:var(--mut);font-size:14px}a{color:var(--acc)}input,select{font:inherit;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);width:100%}
.m{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px}.t{font-weight:600}.r{display:flex;justify-content:space-between;gap:8px;font-size:14px;margin-top:3px}.ok{color:var(--acc);font-weight:600}.no{color:var(--bad);font-weight:600}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}.st{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px}.st b{display:block;font-size:19px}.st span{color:var(--mut);font-size:13px}table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}td:not(:first-child),th:not(:first-child){text-align:right}.wrap{overflow-x:auto}details{font-size:14px;margin-top:6px}</style></head><body><main>
<h1>Geçmiş Maç Sınavı</h1><div class="sub">Motor her maçı yalnızca o tarihten önceki verilerle tahmin etti. <a href="./">Bugünün maçlarına dön</a></div>
<h2>İki yılın özeti</h2><div class="grid" id="sum"></div><h2>Hangi oran daha iyi?</h2><div class="sub">Gerçek oranı bilinen seçenekler, 100 seçimde kâr/zarar birimi.</div><div class="wrap"><table id="bands"></table></div>
<h2>Tarih seç</h2><input type="date" id="d"><select id="lg" aria-label="Lig" style="margin-top:8px"></select><div class="sub" id="wk" style="margin:8px 0"></div><section id="list"></section></main>
<script>const $=i=>document.getElementById(i),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])),fm=f=>f?`${f.maç} maç: ${f.g}G ${f.b}B ${f.m}M · attı ${f.atılan}, yedi ${f.yenilen}`:"veri yok",sg=v=>`${v>0?"+":""}${v}`;let I,W=[],cur="";
const mark=o=>o?'<span class="ok">Tuttu</span>':'<span class="no">Tutmadı</span>';
function draw(){const day=$("d").value,lg=$("lg").value,l=W.filter(x=>x.t===day&&(!lg||x.l===lg));$("list").innerHTML=l.map(x=>`<article class="m"><div class="sub">${esc(x.l)}</div><div class="t">${esc(x.h)} – ${esc(x.a)} · Skor ${esc(x.s)}</div><div class="r"><span>Maç sonucu tahmini: ${esc(x.ms)}</span>${mark(x.msOk)}</div><div class="r"><span>Olası skor: ${esc(x.ls)} (beklenen gol ${x.eg.join(" – ")})</span>${mark(x.lsOk)}</div><div class="r"><span>${esc(x.ou)}</span>${mark(x.ouOk)}</div>${x.p?`<div class="r"><span>Motorun seçimi: <b>${esc(x.p.label)}</b> @ ${x.p.odd} ${x.p.real?"":"(tahmini oran)"}${x.p.g?" · güvenli":""}</span>${mark(x.p.ok)}</div>`:""}<details><summary>Takım kıyası (son 5 yıl)</summary><p>${esc(x.h)}: ${esc(fm(x.fh))}<br>${esc(x.a)}: ${esc(fm(x.fa))}<br>Son 5 maç: ${esc(x.fH||"–")} / ${esc(x.fA||"–")}${(x.h2||[]).length?`<br>Karşılıklı: ${x.h2.map(esc).join(" · ")}`:""}</p></details></article>`).join("")||`<div class="m sub">Bu tarihte sınavda maç yok.</div>`}
async function load(){const v=$("d").value;if(!v)return;const d=new Date(v+"T00:00:00Z"),w=new Date(d-((d.getUTCDay()+6)%7)*864e5).toISOString().slice(0,10);if(w!==cur){cur=w;try{W=await fetch(`replay/${w}.json`).then(r=>r.json())}catch{W=[]}const s=I.haftalar.find(x=>x.hafta===w);$("wk").textContent=s?`Bu hafta: ${s.maç} maç, sonuç ${s.ms} doğru (piyasa ${s.piyasaMs}), skor ${s.skor} doğru, güvenli seçim ${s.seçimTutan}/${s.seçim}.`:"";const ls=[...new Set(W.map(x=>x.l))].sort();$("lg").innerHTML=`<option value="">Tüm ligler</option>`+ls.map(x=>`<option>${esc(x)}</option>`).join("")}draw()}
fetch("replay-index.json").then(r=>r.json()).then(i=>{I=i;const t=i.toplam;$("sum").innerHTML=[["Maç",t.maç],["Sonuç doğru",t.maçSonucu],["Piyasa doğru",t.piyasaMaçSonucu],["Tam skor doğru",t.skor],["2,5 Alt/Üst doğru",t.üstAlt],["Güvenli seçim",`${t.güvenliTutan}/${t.güvenliSeçim}`]].map(([a,b])=>`<div class="st"><b>${b}</b><span>${a}</span></div>`).join("");$("bands").innerHTML=`<tr><th>Oran</th><th>Seçim</th><th>Tutan</th><th>Hepsi</th><th>Motor değer gördü</th></tr>`+i.oranBandı.map(b=>`<tr><td>${esc(b.bant)}</td><td>${b.hepsi.seçim}</td><td>${b.hepsi.tutan??0}</td><td>${b.hepsi.seçim?sg(b.hepsi.getiri100):"–"}</td><td>${b.motorDeğerGördü.seçim?sg(b.motorDeğerGördü.getiri100)+` (${b.motorDeğerGördü.seçim})`:"–"}</td></tr>`).join("");const h=i.haftalar;$("d").min=h[0]?.hafta;$("d").value=h.some(x=>x.hafta==="2024-02-19")?"2024-02-23":h.at(-1).hafta;load()});$("d").onchange=load;$("lg").onchange=draw;</script></body></html>
