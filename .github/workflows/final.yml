name: Son karar
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/walk5.mjs", ".github/workflows/final.yml"]
permissions:
  contents: write
  actions: write
concurrency: { group: final, cancel-in-progress: false }
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/pmhist.mjs
      - run: node scripts/basket.mjs
        continue-on-error: true
      - run: node --max-old-space-size=6000 scripts/walk5.mjs
      - name: Kaydet
        run: |
          git config user.name "tahmin-robotu"; git config user.email "tahmin-robotu@users.noreply.github.com"
          git add -f data/pmhist.json docs/pmtest.json docs/basket.json docs/walk5.json config/pmrule.json config/basket.json config/final.json; git diff --cached --quiet || git commit -m "Son karar sonucu"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 10; done
      - run: gh workflow run update.yml -R "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
