name: Dersleri guncelle
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: review, cancel-in-progress: false }
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/review.mjs
      - name: Kaydet
        run: |
          git config user.name "tahmin-robotu"; git config user.email "tahmin-robotu@users.noreply.github.com"
          git add docs config; git diff --cached --quiet || git commit -m "Ders guncellemesi"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 10; done
