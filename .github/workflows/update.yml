name: Tahminleri guncelle
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/run.mjs", "lib/**", "config/engine.json", ".github/workflows/update.yml"]
permissions:
  contents: write
concurrency: { group: update, cancel-in-progress: false }
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: git pull --ff-only
      - run: node scripts/run.mjs
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      - name: Kaydet
        run: |
          git config user.name "tahmin-robotu"; git config user.email "tahmin-robotu@users.noreply.github.com"
          git add docs; git diff --cached --quiet || git commit -m "Veri guncellemesi"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 10; done
