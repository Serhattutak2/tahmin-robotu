name: Son iki gun
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/last2.mjs"]
permissions:
  contents: write
concurrency: { group: last2, cancel-in-progress: false }
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/last2.mjs
      - name: Kaydet
        run: |
          git config user.name "tahmin-robotu"; git config user.email "tahmin-robotu@users.noreply.github.com"
          git add docs config; git diff --cached --quiet || git commit -m "Son iki gun sonucu"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 10; done
