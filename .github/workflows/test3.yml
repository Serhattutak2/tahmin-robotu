name: Son 3 yil futbol sinavi
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/test3.mjs", ".github/workflows/test3.yml"]
permissions:
  contents: write
  actions: write
concurrency: { group: test3, cancel-in-progress: false }
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node --max-old-space-size=6000 scripts/test3.mjs
      - name: Kaydet
        run: |
          git config user.name "tahmin-robotu"; git config user.email "tahmin-robotu@users.noreply.github.com"
          git add docs/test3.json; git diff --cached --quiet || git commit -m "Son 3 yil futbol sinavi sonucu"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 10; done
        env:
          GH_TOKEN: ${{ github.token }}
