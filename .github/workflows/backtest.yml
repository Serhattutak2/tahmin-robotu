name: Gecmis test
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: backtest, cancel-in-progress: false }
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node --test
      - run: git pull --ff-only
      - run: node scripts/backtest.mjs
      - name: Kaydet
        run: |
          git config user.name "tahmin-robotu"; git config user.email "tahmin-robotu@users.noreply.github.com"
          git add docs config; git diff --cached --quiet || git commit -m "Gecmis test sonucu"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 10; done
