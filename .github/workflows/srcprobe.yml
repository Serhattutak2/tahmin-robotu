name: Kaynak denetimi
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/srcprobe.mjs", ".github/workflows/srcprobe.yml"]
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/srcprobe.mjs
      - run: |
          git config user.name "tahmin-robotu"; git config user.email "tahmin-robotu@users.noreply.github.com"
          git add docs/srcprobe.json; git diff --cached --quiet || git commit -m "Kaynak denetimi"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 10; done
