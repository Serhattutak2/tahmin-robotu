name: NBA kaynak denemesi
on:
  push:
    branches: [main]
    paths: [".github/workflows/nbaprobe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s -m 30 "https://gamma-api.polymarket.com/events?tag_slug=nba&closed=true&limit=100&order=endDate&ascending=false" -o /tmp/o
          python3 -c "
          import json;d=json.load(open('/tmp/o'));print(len(d))
          g=[e for e in d if e.get('slug','').startswith('nba-')]
          print(len(g)); 
          for e in g[:5]: print(e.get('slug'), e.get('score'), e.get('ended'), e.get('endDate'), [k for k in e.keys() if 'score' in k.lower() or 'period' in k.lower()])
          print(min((e.get('endDate') or '') for e in g) if g else None)"
