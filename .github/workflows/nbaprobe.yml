name: NBA kaynak denemesi
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/nbaprobe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36"
          for u in "https://cdn.nba.com/static/json/staticData/scheduleLeagueV2.json" "https://cdn.nba.com/static/json/liveData/scoreboard/todaysScoreboard_00.json" "https://www.thesportsdb.com/api/v1/json/123/eventsseason.php?id=4387&s=2025-2026" "https://www.thesportsdb.com/api/v1/json/123/eventspastleague.php?id=4387" "https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard?dates=20261108" "https://api.sportsdata.io" "https://www.basketball-reference.com/robots.txt"; do
            echo "== $u"; curl -s -m 20 -A "$UA" -H "Referer: https://www.nba.com/" -H "Origin: https://www.nba.com" -o /tmp/o -w "%{http_code} %{size_download}\n" "$u"; head -c 300 /tmp/o; echo; done
