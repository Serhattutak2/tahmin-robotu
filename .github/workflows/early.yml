name: Erken oran ve korner kart testi
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/early.mjs", "scripts/corners.mjs", ".github/workflows/early.yml"]
  schedule:
    - cron: "17 4 * * 1"
permissions: { contents: write }
concurrency: { group: early, cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node --max-old-space-size=6000 scripts/early.mjs
      - run: node --max-old-space-size=6000 scripts/corners.mjs
      - name: Kaydet
        run: |
          git config user.name "tahmin-robotu"; git config user.email "actions@github.com"
          git add docs/early.json config/early.json docs/corners.json config/corners.json; git diff --cached --quiet || git commit -m "Erken oran ve korner kart sonucu"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
