name: Oyuncu bazli motor testi
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/hf_players.py", ".github/workflows/hfplayers.yml"]
permissions:
  contents: write
  actions: write
concurrency: { group: hfplayers, cancel-in-progress: false }
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install duckdb pandas lightgbm
      - run: python scripts/hf_players.py
      - name: Kaydet
        run: |
          git config user.name "tahmin-robotu"; git config user.email "tahmin-robotu@users.noreply.github.com"
          git add docs/hfplayers.json; git diff --cached --quiet || git commit -m "Oyuncu bazli motor sonucu"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 10; done
