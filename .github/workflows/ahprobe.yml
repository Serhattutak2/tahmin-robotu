name: Handikap veri denemesi
on:
  push:
    branches: [main]
    paths: [".github/workflows/ahprobe.yml"]
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s -m 60 https://www.football-data.co.uk/fixtures.csv -o f.csv; head -1 f.csv | tr ',' '\n' | grep -n "AH" | head; wc -l f.csv; python3 -c "
          import csv;r=list(csv.DictReader(open('f.csv',encoding='utf-8-sig')));print(len(r));print([(x['Div'],x['Date'],x['HomeTeam'],x.get('AHh'),x.get('B365AHH'),x.get('PAHH'),x.get('AvgAHH')) for x in r[:8]])"
