name: Hafta hafta sinav
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/replay.mjs", ".github/workflows/replay.yml"]
permissions:
  contents: write
  actions: write
concurrency: { group: replay, cancel-in-progress: false }
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node --max-old-space-size=6000 scripts/replay.mjs
      - name: Kaydet
        run: |
          git config user.name "tahmin-robotu"; git config user.email "tahmin-robotu@users.noreply.github.com"
          git add docs/replay docs/replay-index.json; git diff --cached --quiet || git commit -m "Hafta hafta sinav sonucu"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 10; done
      - run: gh workflow run update.yml -R "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
